; Timed Block Dodge and Counter - Configuration
; Standalone timed block, counter attack, ward parry, and timed dodge



; ============================================================================
; Core Timed Block Settings
; ============================================================================
sBlockKey = V
fStaggerDistance = 128.000000
; Per-equipment damage reduction on successful timed block (0-100, 100 = full negate)
fDmgReductionShield = 100.000000
fDmgReductionUnarmed = 100.000000
fDmgReductionSword = 100.000000
fDmgReductionDagger = 100.000000
fDmgReductionAxe = 100.000000
fDmgReductionMace = 100.000000
fDmgReductionGreatsword = 100.000000
fDmgReductionBattleaxe = 100.000000
bPerkLockedBlock = false
bOnlyWithShield = false
bPerkLockedStagger = false
bEnableExplosion = false
fParryWindowDurationMs = 110.000000


; ============================================================================
; HITSTOP - Freezes the attacker's animation on timed block
; Unlike global slowdown, this only affects the attacker!
; Your block animation will play fully while the enemy freezes.
; ============================================================================
[Hitstop]

; Enable hitstop effect on timed block
bEnableHitstop = true

; Animation speed during hitstop (0.0 = complete freeze, 0.1 = very slow)
; Recommended: 0.0 to 0.1 for dramatic effect
fHitstopSpeed = 0.250000

; Duration of the hitstop in seconds
; Recommended: 0.1 to 0.2 for responsive feel
fHitstopDuration = 0.250000


; ============================================================================
; STAGGER - Force attacker into stagger animation on timed block
; This makes the attacker visibly react to being parried
; ============================================================================
[Stagger]

; Enable stagger effect on timed block
bEnableStagger = true

; Stagger magnitude (how heavy the stagger animation is)
; 0.0 = small stagger (flinch)
; 0.3 = medium stagger
; 0.7 = large/heavy stagger (recommended for timed block)
; 1.0+ = largest stagger (very dramatic)
fStaggerMagnitude = 0.700000
fPowerAttackStaggerMagnitude = 1.000000
bUseStaggerChance = false
fBaseStaggerChance = 50.000000
fMaxStaggerChance = 100.000000
bStaggerUseBlockSkill = true
bStaggerUseWeaponSkill = false


; ============================================================================
; PUSHBACK - Push the attacker away on successful timed block
; Disabled by default since stagger provides better feedback
; ============================================================================
[Pushback]

; Enable pushing the attacker back on timed block
bEnablePushback = false

; How far to push the attacker (higher = more distance)
; Recommended: 1.0 to 3.0
fPushbackMagnitude = 1.500000


; ============================================================================
; CAMERA SHAKE - Adds impact feel to the timed block
; ============================================================================
[CameraShake]

; Enable camera shake on timed block
bEnableCameraShake = true

; Shake intensity (higher = more shake)
; Recommended: 0.3 to 1.0
fCameraShakeStrength = 1.620000

; Shake duration in seconds
; Recommended: 0.1 to 0.3
fCameraShakeDuration = 0.300000


; ============================================================================
; SOUND - Play a sound on successful timed block
; ============================================================================
[Sound]

; Enable sound effect on timed block
bEnableSound = true

; Sound descriptor EditorID or file path
; For EditorID: just use the name like "UIMenuOK"
; To use a custom sound: Create folder: Data/SKSE/Plugins/TimedBlockDodgeCounter/
; Place your WAV file there named timedblock.wav
; Enable "Use Custom WAV File" in the GUI
sSoundPath = UIMenuOK
bUseCustomWav = true
bUseInGameAudio = false
fCustomWavVolume = 0.750000


; ============================================================================
; DEBUG
; ============================================================================
[Log]

; Enable debug logging (for troubleshooting)
Debug = true
DebugScreenTimedBlock = false
DebugScreenCounterAttack = false
DebugScreenWard = false
DebugScreenDodge = false


; ============================================================================
; Forms (perk requirements and optional explosion VFX)
; Use hex FormID without 0x prefix, e.g. 800
; ============================================================================
[Forms]
PerkModName = 
TimedBlockPerk = 
StaggerPerk = 

; Explosion VFX on successful timed block (requires bEnableExplosion = true above)
; Example: ExplosionModName = Skyrim.esm  /  ExplosionFormID = 10FC17
ExplosionModName = 
ExplosionFormID = 


[Slowmo]
bEnableSlowmo = false
fSlowmoSpeed = 0.250000
fSlowmoDuration = 0.100000


[Cooldown]
bEnableCooldown = true
fCooldownDurationMs = 250.000000
bIgnoreCooldownOutsideRange = true
fCooldownIgnoreDistance = 400.000000


[CounterAttack]
bEnableCounterAttack = true
fCounterAttackWindow = 0.750000
bPreventPlayerStagger = true


[ParryWindow]
fParryWindowDurationMs = 110.000000


[CounterDamage]
bEnableCounterDamageBonus = true
fCounterDamageBonusPercent = 100.000000
fCounterDamageBonusTimeout = 4.000000
bEnableCounterStrikeSound = true
bCounterStrikeInGameAudio = false
fCounterStrikeSoundVolume = 0.900000


[CounterLunge]
