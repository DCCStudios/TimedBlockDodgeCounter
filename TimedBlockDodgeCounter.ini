fCounterLungeDistance = 50.000000
fCounterLungeSpeed = 0.050000
iCurve = 0
fMeleeStopDistance = 128.000000


[CounterSlowTime]
bEnableCounterSlowTime = true
fCounterSlowTimeScale = 0.400000
fCounterSlowTimeMaxDuration = 0.500000
sCounterSlowStartEvent = CastOKStart
sCounterSlowEndEvent = preHitFrame
bCounterSlowStartAfterLunge = false


[StaminaRestore]
bEnableStaminaRestore = true
fStaminaRestorePercent = 100.000000


[TimedDodge]
bEnableTimedDodge = true
fSlomoDuration = 0.300000
fSlomoSpeed = 0.250000
fCooldown = 3.000000
fDetectionRange = 275.000000
fDamageCooldown = 1.500000
; Melee hit contact (Precision PreHit). Not tied to HP — avoids DoT/poison false triggers.
fHitContactCooldown = 1.500000
bIframes = true
; Seconds of immunity vs the triggering attacker after a timed dodge (prevents the attack that triggered the dodge from dealing damage). 0 = off
fAttackerImmunity = 1.000000
bCounterAttack = true

; Counter attack damage bonus for timed dodge (50 = +50% = 1.5x total damage)
; Overrides the timed block counter damage setting when triggered from a timed dodge
fCounterDamagePercent = 50.000000
bRadialBlur = true
fBlurStrength = 0.800000
fBlurBlendSpeed = 1.200000
fBlurRampUp = 0.100000
fBlurRampDown = 0.200000
fBlurRadius = 0.240000
bApplyBlockEffects = true

; Stagger the attacker on timed dodge (disabled by default)
bStagger = false

; Slow the attacker's animation speed on timed dodge (per-actor, not game speed)
bAttackerSlow = true

; Attacker animation speed multiplier during slow (0.05 = 5%)
fAttackerSlowSpeed = 0.400000

; Duration of attacker animation slow in seconds
fAttackerSlowDuration = 1.500000

; Play a sound on successful timed dodge
; WAV file: Data/SKSE/Plugins/TimedBlockDodgeCounter/timeddodge.wav
bSound = true
bInGameAudio = false

; Volume for timed dodge sound (0.0-1.0)
fSoundVolume = 1.000000
fForgivenessMs = 85.000000
fHitWindowMs = 600.000000
bCounterLunge = true
fCounterDamageTimeout = 4.000000
fCounterWindowMs = 1500.000000
fCounterLungeDistance = 150.000000
fCounterLungeSpeed = 0.050000
iCounterLungeCurve = 5
fCounterLungeMeleeStop = 145.000000
bCounterSpellHit = true
fCounterSpellDamagePercent = 50.000000
bCounterRanged = true
fCounterRangedDamagePercent = 50.000000
fCounterRangedWindowMs = 2500.000000
fCounterDrawSpeedMult = 10.000000
bCounterRangedSound = true

; Precision Integration — require active weapon hitbox for stricter detection
; When Precision is installed, only triggers timed dodge if the enemy has a live
; attack collision (not just any attack animation state). Accounts for enemy
; movement velocity when estimating if the swing can reach you.
bPrecisionStrictDodge = true
bPrecisionFallbackToAttackState = false
fPrecisionReachTolerance = 64.000000
fPrecisionLookaheadSec = 0.200000


